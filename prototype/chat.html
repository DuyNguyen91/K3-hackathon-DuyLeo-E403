<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>VLearn AI | Chat</title>
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/components.css" />
    <link rel="stylesheet" href="css/animation.css" />
    <link rel="stylesheet" href="css/override.css" />
  </head>
  <body data-page="chat">
    <div class="app-shell">
      <aside class="sidebar">
        <div class="brand">
          <div class="brand-mark">V</div>
          <div>
            <h1>VLearn AI</h1>
            <p>Slide companion</p>
          </div>
        </div>
        <nav class="sidebar-nav">
          <a href="index.html" class="nav-item">Home</a>
          <a href="upload.html" class="nav-item">Material</a>
          <a href="chat.html" class="nav-item active">Chat</a>
          <a href="result.html" class="nav-item">Answer</a>
          <a href="quiz.html" class="nav-item">Quiz</a>
        </nav>
      </aside>

      <main class="main-panel">
        <header class="topbar">
          <div>
            <p class="eyebrow">Step 2</p>
            <h2>Ask anything about the paragraph</h2>
          </div>
          <span class="pill">Document loaded</span>
        </header>

        <section class="glass-card chat-card">
          <div class="chat-thread">
            <div class="message ai-message">
              <div class="avatar">V</div>
              <div class="message-bubble">
                <p>I’m ready to explain the highlighted paragraph in simple words.</p>
              </div>
            </div>
            <div class="message user-message">
              <div class="message-bubble user-bubble">
                <p>Explain this paragraph in simple words.</p>
              </div>
            </div>
          </div>

          <form class="chat-input-row" id="chatForm">
            <label class="sr-only" for="questionInput">Ask a question</label>
            <textarea id="questionInput" class="chat-input" placeholder="Ask anything..."></textarea>
            <button class="btn btn-primary" type="submit">Send</button>
          </form>

          <div class="loading-state" id="loadingState" hidden>
            <div class="dots">
              <span></span><span></span><span></span>
            </div>
            <p>Generating your explanation</p>
          </div>
        </section>

        <div class="page-nav">
          <a class="btn btn-secondary" href="upload.html">Back</a>
          <a class="btn btn-primary" href="result.html">Next</a>
          <a class="btn btn-secondary" href="index.html">Home</a>
        </div>
      </main>
    </div>

    <script src="js/fakeData.js"></script>
    <script src="js/app.js"></script>
    <script src="js/router.js"></script>
  </body>
</html>
