<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>VLearn AI | Save Note</title>
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/components.css" />
    <link rel="stylesheet" href="css/animation.css" />
    <link rel="stylesheet" href="css/override.css" />
  </head>
  <body data-page="note">
    <div class="app-shell">
      <aside class="sidebar">
        <div class="brand">
          <div class="brand-mark">V</div>
          <div>
            <h1>VLearn AI</h1>
            <p>Slide companion</p>
          </div>
        </div>
        <nav class="sidebar-nav">
          <a href="index.html" class="nav-item">Home</a>
          <a href="upload.html" class="nav-item">Material</a>
          <a href="chat.html" class="nav-item">Chat</a>
          <a href="result.html" class="nav-item">Answer</a>
          <a href="quiz.html" class="nav-item">Quiz</a>
        </nav>
      </aside>

      <main class="main-panel">
        <header class="topbar">
          <div>
            <p class="eyebrow">Step 6</p>
            <h2>Save your note</h2>
          </div>
          <span class="pill">Capture insight</span>
        </header>

        <section class="glass-card note-card">
          <h3>Save Note</h3>
          <label class="field-label" for="noteTitle">Title</label>
          <input id="noteTitle" class="input" value="Machine Learning" />

          <label class="field-label" for="noteContent">Content</label>
          <textarea id="noteContent" class="upload-area note-area">Machine Learning allows computers to learn patterns from data without explicit programming.</textarea>

          <label class="field-label">Tags</label>
          <div class="chip-row">
            <span class="chip">AI</span>
            <span class="chip">ML</span>
            <span class="chip">Study</span>
          </div>

          <button class="btn btn-primary save-note-btn" id="saveNoteBtn" type="button">Save</button>
        </section>

        <div class="page-nav">
          <a class="btn btn-secondary" href="sources.html">Back</a>
          <a class="btn btn-primary" href="finish.html">Next</a>
          <a class="btn btn-secondary" href="index.html">Home</a>
        </div>
      </main>
    </div>

    <div class="toast" id="toast" hidden></div>

    <script src="js/fakeData.js"></script>
    <script src="js/app.js"></script>
    <script src="js/router.js"></script>
    <script src="js/note.js"></script>
  </body>
</html>
